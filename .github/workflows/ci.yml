name: Deploy Laravel API

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /opt/apps/backend
            git pull origin production
            # The deploy and the admin crontab run these from /opt/backups/bin,
            # outside the checkout, so that copy only ever changed when someone
            # remembered to update it by hand. Once nobody did: every deploy
            # from 2026-08-28 onward died on
            #   /opt/backups/bin/db-backup.sh: No such file or directory
            # because the predeploy snapshot below was merged before the script
            # was ever placed on the box. Re-install from the repo on every
            # deploy so the installed copies cannot drift from source again.
            # install(1) writes through a temp file and renames, so a cron job
            # already executing keeps the inode it started with.
            #
            # media-backup.sh is deliberately NOT synced here. It runs as root
            # from root's crontab, and this script runs as the deploy user --
            # syncing it would make a root-executed file writable by anyone who
            # can push. Install that one by hand, root-owned.
            mkdir -p /opt/backups/bin
            install -m 0755 scripts/db-backup.sh /opt/backups/bin/db-backup.sh
            install -m 0755 scripts/db-backup-check.sh /opt/backups/bin/db-backup-check.sh
            composer install --no-dev --optimize-autoloader
            # Snapshot before migrating. A destructive or buggy migration lands
            # on live money data -- balances, deposits, settled bets -- and
            # without this there is nothing to roll back to. set -e is active,
            # so a failed snapshot aborts the deploy before the migration runs.
            # That is intended: no snapshot, no migration.
            /opt/backups/bin/db-backup.sh --tag predeploy
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            # No view:cache. Blade here is two pages (welcome, the OpenAPI docs),
            # and php-fpm compiles them lazily on first hit anyway. Precompiling
            # from the deploy user fights the web user over ownership of
            # storage/framework/views and fails the whole deploy over a cache
            # warm-up: view:clear silently skips files it cannot unlink, then
            # view:cache dies trying to overwrite them.
            #
            # Must come after config:cache, or the restarted workers boot with
            # the previous config. Without it they keep running the old code and
            # cannot autoload job classes added in this deploy.
            php artisan queue:restart
